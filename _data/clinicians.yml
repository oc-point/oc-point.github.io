- title: Ellen Stem, MA, EdS, NCC; Licensed Professional Counselor
  education:
  - degree: Education Specialist Degree in Marriage and Family Counseling (EdS), College of New Jersey, 2003
  - degree: Master of Arts in Counseling and Personnel Services (MA), Trenton State College, 1996
  - degree: Bachelor of Arts in Elementary Education/Sociology (BA), Gettysburg College, 1975
  summary: Ellen's practice includes individuals, couples, and families. She specializes in addressing issues related to grief/loss, anxiety, depression, stress, substance abuse, and co-dependency. <br><br> Her goal is to work side by side with her clients in a trusting environment to find solutions, strategies for change, and an understanding of the root causes of their issues. Together through therapy, we can navigate through particular challenges in your life as you gain insight and self-empowerment.
  image: ./assets/imgs/ellen_stem.jpg
- title: James McManus, MSSW LCSW BCD; Licensed Clinical Social Worker; Psychotherapist
  education:
  - degree: Master of Science in Social Work (MSSW), U Wisconsin, 1971
  - degree: Bachelor of Science in Education (BA), Glassboro State, 1967
  summary: Jim’s practice includes teens, adults and older adults. Treatment issues include depression, anxiety, life transitions, relationship concerns, trauma and post traumatic distress. He finds the Cognitive Behavioral therapeutic approach to be an effective treatment modality. <br><br> Jim began his career as a Social Worker with the NJ Division of Youth and Family Services in Camden, NJ. Since then he has worked in an array of counseling venues including prior to relocating, many years in private practice, working with children and families in a school setting, on-line global cancer support service and work with Vietnam veterans and active duty troops of the wars in Iraq and Afghanistan.
  image: ./assets/imgs/Jim-McManus.jpg
- title: Dr. Brooke Costa, Psy.D; Licensed Psychologist
  education:
    - degree: Doctor of School Psychology (Psy.D), Fairleigh Dickinson University, 2001
    - degree: New Jersey Licensed Psychologist, 2008
  summary: Dr. Brooke Costa is a licensed psychologist with more than 30 years of experience supporting individuals across the lifespan. She earned her Doctor of Psychology (Psy.D.) in School Psychology from Fairleigh Dickinson University in 2001 and became licensed as a psychologist in New Jersey in 2008. <br><br> Following more than a decade of experience as a school psychologist, Dr. Costa established a private practice serving children, adolescents, and adults. Her clinical work encompasses a wide range of concerns, including autism spectrum disorder (ASD), attention-deficit/hyperactivity disorder (ADHD), anxiety, depression, trauma, women’s issues, and life transitions. <br><br> Dr. Costa also has extensive experience conducting psychological and diagnostic evaluations, including cognitive assessments, functional behavior assessments, and autism evaluations. She has a particular passion for advocating for girls and women on the autism spectrum, with a focus on recognizing and understanding the diverse ways autism may present throughout development. <br><br> Her approach is grounded in collaboration, compassion, and empowerment. Dr. Costa believes in understanding each individual’s unique strengths, challenges, and experiences, while providing thoughtful, individualized support. She strives to help clients build self-awareness, develop practical tools, and navigate life’s challenges with greater confidence and resilience. <br><br> Through her commitment to understanding human development and fostering meaningful growth, Dr. Costa supports individuals and families as they navigate challenges, embrace their strengths, and move toward greater well-being at every stage of life.
  image: ./assets/imgs/dr-costa.jpg
- title: Dr. Joanne Coyle, PsyD; Licensed Psychologist
  education:
  - degree: Doctor of Clinical Psychology (PsyD.), Chestnut Hill College, 2012
  summary: Dr. Coyle’s practice includes adolescents, adults, older adults, couples and family therapy. Treatment includes issues related to depression and anxiety, effects of abuse and trauma, relationship problems and life adjustments. <br><br> Dr. Coyle has 18 years' experience in helping people work through life's challenges. She prides herself in understanding you as a unique individual and will remain a non-judgmental presence to guide you towards insight and options through a holistic approach. Prior to becoming a psychologist, Dr. Coyle was a nurse at Methodist Hospital in Philadelphia.
  image: ./assets/imgs/dr-coyle-picture.jpg